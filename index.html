<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Gussfehler-Schule</title>
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="manifest.json">

<script>(function(){var m='dark';try{m=localStorage.getItem('kompass-theme')||'dark'}catch(e){}var t=m==='auto'?(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{
  --bg:#05080d; --panel:#0b1118; --card:#0f1620; --card2:#0a0f15; --line:#1b2532; --line2:#2a3647; --line3:#36465b; --text:#dfe6ef; --soft:#b9c4d2; --soft2:#c9d2de; --mute:#7f8b9c;
  --up:#1fcf8f; --down:#f0605d; --gold:#f5c542; --blue:#4c9aff; --purple:#b388ff; --orange:#ff9f43; --aqua:#22d3ee; --pink:#ff5fa2; --lime:#a3e635; --indigo:#8b9dff;
  --chart:#020407; --hdr:rgba(5,8,13,.92); --veil:rgba(5,8,13,.75); --on-gold:#1b1505; --on-up:#03140d;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#f3f5f9; --panel:#eef2f7; --card:#ffffff; --card2:#f7f9fc; --line:#dde3ec; --line2:#c9d2de; --line3:#b7c2d1; --text:#131a26; --soft:#3d4757; --soft2:#2c3646; --mute:#5d6879;
  --up:#087f5b; --down:#c62f2c; --gold:#946200; --blue:#1a66c9; --purple:#7445cc; --orange:#b45000; --aqua:#0e7490; --pink:#be185d; --lime:#4d7c0f; --indigo:#4338ca;
  --chart:#ffffff; --hdr:rgba(243,245,249,.92); --veil:rgba(255,255,255,.85); --on-gold:#ffffff; --on-up:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;flex:none}
.brand{font-family:var(--mono);font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1.15;cursor:pointer}
.brand small{display:block;color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.12em}
.theme{margin-left:auto;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.theme button{border:0;background:none;color:var(--mute);font-family:var(--mono);font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px;min-height:32px}
.theme button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.theme button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prog{margin-left:12px;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
.bar{width:110px;height:5px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--gold));width:0;transition:width .4s}
main{display:grid;grid-template-columns:330px 1fr;max-width:1280px;margin:0 auto;min-height:calc(100vh - 60px)}
#nav{border-right:1px solid var(--line);padding:14px 12px 40px;height:calc(100vh - 60px);overflow:auto;position:sticky;top:60px}
#search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none}
#search:focus{border-color:var(--gold)}
.cat{margin:18px 4px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--acc,var(--mute));text-transform:uppercase;display:flex;align-items:center;gap:8px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px;margin:2px 0}
.item:hover{background:var(--card)}
.item.on{background:var(--card);border-color:var(--line2)}
.item img{width:48px;height:32px;flex:none;border-radius:6px;border:1px solid var(--line);background:var(--chart)}
.item b{display:block;font-size:14px;font-weight:600}
.item span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.item .ok{margin-left:auto;color:var(--up);font-size:14px;opacity:0}
.item.seen .ok{opacity:1}
.nores{color:var(--mute);font-size:14px;padding:12px 6px}
#view{padding:18px 22px 60px;min-width:0}
.back{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--mono);font-weight:800;letter-spacing:.03em;font-size:clamp(23px,4.4vw,36px);margin:4px 0 6px;text-transform:uppercase;line-height:1.15}
.lead{color:var(--soft);margin:0 0 14px;font-size:15.5px;line-height:1.5;max-width:760px}
.player{background:var(--chart);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:900px}
.cwrap{position:relative;cursor:pointer}
canvas{display:block;width:100%}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.overlay div{background:var(--veil);border:1px solid var(--line2);border-radius:50%;width:58px;height:58px;display:grid;place-items:center;font-size:22px;padding-left:4px;opacity:.85}
.caption{padding:12px 16px 4px;min-height:80px;border-top:1px solid var(--line)}
.caption .no{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.14em}
.caption p{margin:5px 0 0;font-size:15.5px;line-height:1.45}
.ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px 12px;flex-wrap:wrap}
.cb{background:var(--card);border:1px solid var(--line);border-radius:9px;min-width:40px;height:38px;padding:0 10px;font-family:var(--mono);font-size:14px;font-weight:700}
.cb:hover{border-color:var(--line3)}
.cb.on{border-color:var(--gold);color:var(--gold)}
#seek{flex:1 1 140px;accent-color:var(--down);height:28px;min-width:120px}
.spd{display:inline-flex;gap:4px}
.spd .cb{min-width:38px;padding:0 6px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 14px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;min-width:34px;height:32px;padding:0 10px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.done{color:var(--text)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px;max-width:900px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.box p,.box li{font-size:14.5px;line-height:1.5;color:var(--soft2);margin:0}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.box.g h3{color:var(--up)}.box.y h3{color:var(--gold)}.box.b h3{color:var(--blue)}.box.r h3{color:var(--down)}
.box.b{border-top:3px solid var(--blue)}.box.g{border-top:3px solid var(--up)}.box.y{border-top:3px solid var(--gold)}.box.r{border-top:3px solid var(--down)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px;max-width:900px}
.pn button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:14px;min-width:0}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--mute);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:3px}
.pn button:disabled{opacity:.35;cursor:default}
.disc{color:var(--mute);font-size:12.5px;margin-top:22px;max-width:900px;line-height:1.5}
.disc a{color:var(--aqua)}
.home{max-width:960px}
.hero{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.start{background:var(--up);color:var(--on-up);border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;font-size:14.5px;color:var(--text);text-decoration:none;display:inline-flex;align-items:center}
.bigtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}
.big{position:relative;overflow:hidden;text-align:left;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-height:172px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:var(--acc)}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.big::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 24%,transparent),transparent 70%);pointer-events:none}
.big .bi{position:absolute;right:14px;top:16px;color:var(--acc);z-index:1}
.big .no{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--mute);margin-bottom:6px}
.big h2{font-family:var(--mono);font-weight:800;font-size:clamp(17px,1.6vw + 6px,21px);letter-spacing:.03em;text-transform:uppercase;margin:0 70px 8px 0;line-height:1.2;color:var(--acc)}
.big p{margin:0 0 14px;color:var(--soft);font-size:14.5px;line-height:1.45;max-width:80%}
.big .ft{margin-top:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.big .pb{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}.big .pb i{display:block;height:100%;background:var(--acc)}
.big .go{color:var(--acc);font-size:16px;font-weight:800}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin-top:16px;max-width:960px}
.lc{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.lc:hover{border-color:var(--acc)}
.lc img{width:84px;height:56px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--chart)}
.lc small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--acc)}
.lc b{display:block;font-size:15.5px;margin:2px 0}
.lc span{display:block;font-size:13px;color:var(--mute);line-height:1.35}
.lc .ok{margin-left:auto;color:var(--up);font-size:18px;flex:none}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:760px}
.qbar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--gold)}
.qtype{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);margin-bottom:6px}
.qq{font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px}
.qcv{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--chart)}
.opts{display:grid;gap:8px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--line3)}
.opt.ok{border-color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.opt.bad{border-color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.5}
.fb b{font-family:var(--mono)}
.qnav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qnav button{flex:1;min-width:140px;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.qnav .main{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.score{font-family:var(--mono);font-size:54px;font-weight:800;margin:6px 0}
.rep{display:grid;gap:8px;margin-top:10px}
.rep button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  #nav{display:none}
  #view{padding:14px 12px 50px}
  .bar{width:64px}
  .theme button .tl{display:none}
  .theme button{padding:6px 9px}
  .brand small{display:none}
  .brand{font-size:13.5px}
  header{padding:10px 12px;gap:10px}
  .prog{margin-left:4px}
  .big p{max-width:100%}
}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#0f1620"/><rect x="5" y="9" width="24" height="16" rx="4" fill="#8b95a1"/><circle cx="12" cy="15" r="2.2" fill="#05070a"/><circle cx="16" cy="20" r="1.4" fill="#05070a"/><path d="M22 13l2 3-3 1 2 3-3-1-1 3-1-3-2 1 1-3-2-2 3 0z" fill="#05070a"/><rect x="5" y="9" width="24" height="16" rx="4" fill="none" stroke="#22d3ee" stroke-width="1.4"/></svg>
  <div class="brand" onclick="location.hash=''">GUSSFEHLER-SCHULE<small>BAYAZIT · ERWEITERUNG DER CT-SCHULE</small></div>
  <div class="theme" role="group" aria-label="Darstellung"><button data-m="dark" title="Dunkel">☾<span class="tl"> Dunkel</span></button><button data-m="light" title="Hell">☀<span class="tl"> Hell</span></button><button data-m="auto" title="Automatisch">◐<span class="tl"> Auto</span></button></div>
  <div class="prog"><span id="progtxt">0 / 0</span><div class="bar"><i id="progbar"></i></div></div>
</header>
<main>
  <nav id="nav">
    <input id="search" placeholder="Lektion suchen … z. B. Lunker" autocomplete="off">
    <div id="list"></div>
  </nav>
  <section id="view"></section>
</main>
<script>
"use strict";
/* =================== Farben =================== */
const THEMES={
 dark:{name:'dark',bg:'#020407',text:'#e6ecf3',mute:'#8a96a8',pillBg:'rgba(2,4,7,.9)',metal:'#8b95a1',edge:'rgba(225,232,240,.55)',pore:'#05070a',rim:'rgba(205,214,226,.38)',
  mold:'#26303d',moldLine:'#3c4858',sand:'#a08960',sandDot:'#7a6545',melt:'#ff7a29',meltHi:'#ffd166',up:'#1fcf8f',down:'#f0605d',gold:'#f5c542',blue:'#4c9aff',purple:'#b388ff',orange:'#ff9f43',aqua:'#22d3ee',
  grid:'#111a24',panel:'#0b1118',line:'#1f2a38',ctAir:'#07090c',iron:'#eef2f6',bubble:'#e9f4ff',pink:'#ff5fa2',lime:'#a3e635',indigo:'#8b9dff',sandCT:'#5f5b53'},
 light:{name:'light',bg:'#ffffff',text:'#131a26',mute:'#5d6879',pillBg:'rgba(255,255,255,.95)',metal:'#98a2ae',edge:'rgba(40,48,60,.5)',pore:'#141a22',rim:'rgba(255,255,255,.55)',
  mold:'#d3dbe6',moldLine:'#aeb9c8',sand:'#d9c49c',sandDot:'#b39a6e',melt:'#f06a1d',meltHi:'#ffb547',up:'#087f5b',down:'#c62f2c',gold:'#946200',blue:'#1a66c9',purple:'#7445cc',orange:'#b45000',aqua:'#0e7490',
  grid:'#eef1f5',panel:'#f3f5f9',line:'#dde3ec',ctAir:'#0b0e12',iron:'#eef2f6',bubble:'#ffffff',pink:'#be185d',lime:'#4d7c0f',indigo:'#4338ca',sandCT:'#6e685d'}};
const C=Object.assign({},THEMES.dark);
function setCanvasTheme(t){Object.assign(C,THEMES[t]||THEMES.dark);}
const MONO="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace";
const W=600,H=400;
let FS=1, NOPILL=false, placed=[];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const E=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const F=(t,a,d=450)=>clamp((t-a)/d);
const IN=(t,a,b)=>F(t,a)*(1-F(t,b));
const de=(x,d=1)=>x.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function font(sz,w=800){return `${w} ${(sz*FS).toFixed(1)}px ${MONO}`;}

/* =================== Zeichen-Helfer =================== */
function rrp(p,x,y,w,h,r){r=Math.min(r,w/2,h/2);p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);p.closePath();}
function mk(list){const p=new Path2D();for(const s of list){if(s[0]==='r')rrp(p,s[1],s[2],s[3],s[4],s[5]||0);else if(s[0]==='c'){p.moveTo(s[1]+s[3],s[2]);p.arc(s[1],s[2],s[3],0,Math.PI*2);p.closePath();}else if(s[0]==='p'){s[1].forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));p.closePath();}}return p;}
const patCache={};
function metalPat(g){const k=C.name;if(!patCache[k]){const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d');x.fillStyle=C.metal;x.fillRect(0,0,120,120);const r=rng(7);for(let i=0;i<2600;i++){const v=r();x.fillStyle=v<.5?`rgba(0,0,0,${.05+r()*.08})`:`rgba(255,255,255,${.04+r()*.07})`;x.fillRect(r()*120|0,r()*120|0,1+(r()*2|0),1+(r()*2|0));}patCache[k]=c;}return g.createPattern(patCache[k],'repeat');}
function fillMetal(g,p,a=1,edge=true){if(a<=0)return;g.save();g.globalAlpha=a;g.fillStyle=metalPat(g);g.fill(p,'evenodd');if(edge){g.strokeStyle=C.edge;g.lineWidth=1.4;g.stroke(p);}g.restore();}
function fillMelt(g,p,a=1,y0=60,y1=360){if(a<=0)return;g.save();g.globalAlpha=a;const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,C.meltHi);gr.addColorStop(1,C.melt);g.fillStyle=gr;g.fill(p,'evenodd');g.restore();}
function fillSand(g,p,a=1,seed=3,box=[0,0,W,H]){if(a<=0)return;g.save();g.globalAlpha=a;g.fillStyle=C.sand;g.fill(p,'evenodd');g.clip(p,'evenodd');const r=rng(seed);g.fillStyle=C.sandDot;for(let i=0;i<500;i++){g.fillRect(box[0]+r()*box[2],box[1]+r()*box[3],1.6,1.6);}g.restore();}
function fillMold(g,p,a=1){if(a<=0)return;g.save();g.globalAlpha=a;g.fillStyle=C.mold;g.fill(p,'evenodd');g.strokeStyle=C.moldLine;g.lineWidth=1.5;g.stroke(p);g.clip(p,'evenodd');g.strokeStyle=hexA(C.name==='dark'?'#ffffff':'#000000',.05);g.lineWidth=1;for(let x=-H;x<W;x+=14){g.beginPath();g.moveTo(x,0);g.lineTo(x+H,H);g.stroke();}g.restore();}
function bg(g){g.fillStyle=C.bg;g.fillRect(0,0,W,H);}
function ctFrame(g,x=0,y=0,w=W,h=H){g.fillStyle=C.ctAir;g.fillRect(x,y,w,h);}
function tag(g,txt){if(NOPILL)return;g.save();g.font=font(10.5,700);g.fillStyle=C.mute;g.textAlign='left';g.textBaseline='alphabetic';g.fillText(txt,12,H-10);g.restore();}
function pill(g,x,y,txt,col,k=1,al='c'){
  if(NOPILL||k<=0)return;
  g.save();g.globalAlpha=Math.min(1,k);g.font=font(13,800);
  const tw=g.measureText(txt).width,ph=22*FS,pw=tw+16*FS;
  let x0=al==='c'?x-pw/2:al==='l'?x:x-pw;x0=clamp(x0,4,W-pw-4);
  const base=clamp(y-ph/2,4,H-ph-4);let y0=base;
  const hit=yy=>placed.some(b=>x0<b.x+b.w+3&&x0+pw+3>b.x&&yy<b.y+b.h+3&&yy+ph+3>b.y);
  for(const o of [0,1,-1,2,-2,3,-3]){const yy=clamp(base+o*(ph+5),4,H-ph-4);if(!hit(yy)){y0=yy;break;}}
  placed.push({x:x0,y:y0,w:pw,h:ph});
  g.beginPath();rrp(g,x0,y0,pw,ph,ph/2);g.fillStyle=C.pillBg;g.fill();g.lineWidth=1.6;g.strokeStyle=col;g.stroke();
  g.fillStyle=col;g.textBaseline='middle';g.textAlign='left';g.fillText(txt,x0+8*FS,y0+ph/2+.5);g.restore();}
function text(g,x,y,txt,col,sz=13,al='left',k=1){if(NOPILL||k<=0)return;g.save();g.globalAlpha=k;g.font=font(sz,800);g.fillStyle=col;g.textAlign=al;g.textBaseline='middle';g.fillText(txt,x,y);g.restore();}
function arrow(g,x1,y1,x2,y2,col,k=1,w=2.6){if(k<=0)return;const x=x1+(x2-x1)*k,y=y1+(y2-y1)*k,a=Math.atan2(y2-y1,x2-x1),s=9;g.save();g.globalAlpha=Math.min(1,k*2);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x,y);g.stroke();g.beginPath();g.moveTo(x+Math.cos(a)*2,y+Math.sin(a)*2);g.lineTo(x-s*Math.cos(a-.45),y-s*Math.sin(a-.45));g.lineTo(x-s*Math.cos(a+.45),y-s*Math.sin(a+.45));g.closePath();g.fill();g.restore();}
function dim(g,x1,y1,x2,y2,col,k=1){if(k<=0)return;const mx=(x1+x2)/2,my=(y1+y2)/2;arrow(g,mx,my,x1,y1,col,k,2);arrow(g,mx,my,x2,y2,col,k,2);}
function ring(g,x,y,r,col,k=1){if(k<=0)return;g.save();g.globalAlpha=k;g.strokeStyle=col;g.lineWidth=2.2;g.setLineDash([6,5]);g.beginPath();g.arc(x,y,r*(1.3-.3*k),0,Math.PI*2);g.stroke();g.restore();}
function cross(g,x,y,col,k=1){if(k<=0)return;g.save();g.globalAlpha=k;g.strokeStyle=col;g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(x-10,y-10);g.lineTo(x+10,y+10);g.moveTo(x+10,y-10);g.lineTo(x-10,y+10);g.stroke();g.restore();}
function pore(g,x,y,r,k=1){if(k<=0)return;const R=r*k;if(R<.3)return;g.fillStyle=C.pore;g.beginPath();g.arc(x,y,R,0,Math.PI*2);g.fill();g.strokeStyle=C.rim;g.lineWidth=Math.max(.7,R*.16);g.stroke();}
function poreField(seed,n,inside,rmin,rmax){const r=rng(seed),L=[];let guard=0;while(L.length<n&&guard++<5000){const box=inside.box,x=box[0]+r()*box[2],y=box[1]+r()*box[3],rr=rmin+Math.pow(r(),2)*(rmax-rmin);if(inside.ok(x,y,rr)&&!L.some(q=>Math.hypot(q.x-x,q.y-y)<q.r+rr+3))L.push({x,y,r:rr});}return L;}
function pores(g,L,t,a,b){L.forEach((q,i)=>{const s=a+(b-a)*i/L.length;pore(g,q.x,q.y,q.r,E(t,s,s+500));});}
function shrinkShape(seed,size,flat=.8){const r=rng(seed),pts=[],N=54,p1=r()*6,p2=r()*6;for(let i=0;i<N;i++){const a=i/N*Math.PI*2;let rad=size*(.5+.16*Math.sin(3*a+p1)+.12*Math.sin(5*a+p2)+(r()-.5)*.3);if(i%3===0&&r()<.6)rad*=1.45+r()*.9;pts.push([Math.cos(a)*rad,Math.sin(a)*rad*flat]);}return pts;}
function drawShrink(g,x,y,pts,k=1){if(k<=0)return;g.beginPath();pts.forEach((p,i)=>{const X=x+p[0]*k,Y=y+p[1]*k;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.closePath();g.fillStyle=C.pore;g.fill();g.strokeStyle=C.rim;g.lineWidth=1;g.stroke();}
function spongeList(seed,cx,cy,rx,ry,n){const r=rng(seed),L=[];for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=Math.sqrt(r()),x=cx+Math.cos(a)*rx*d,y=cy+Math.sin(a)*ry*d,pts=[],m=5+(r()*3|0),s=1.1+r()*3*(1-d*.55);for(let j=0;j<m;j++){const b=j/m*6.283,q=s*(.35+r()*.9);pts.push([x+Math.cos(b)*q*(1+r()*1.2),y+Math.sin(b)*q]);}L.push(pts);}return L;}
function drawSponge(g,L,k=1){const n=Math.floor(L.length*clamp(k));g.fillStyle=C.pore;for(let i=0;i<n;i++){const p=L[i];g.beginPath();p.forEach((q,j)=>j?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();}}
function crackPts(seed,x1,y1,x2,y2,n=16,j=6){const r=rng(seed),P=[];for(let i=0;i<=n;i++){const f=i/n,ox=(i===0||i===n)?0:(r()-.5)*2*j,oy=(i===0||i===n)?0:(r()-.5)*2*j;P.push([x1+(x2-x1)*f+ox,y1+(y2-y1)*f+oy]);}return P;}
function drawCrack(g,P,k=1,w=3,col){if(k<=0)return;const n=(P.length-1)*clamp(k);g.save();g.strokeStyle=col||C.pore;g.lineCap='round';g.lineJoin='round';for(let i=0;i<Math.ceil(n);i++){const f=Math.min(1,n-i),a=P[i],b=P[i+1];g.lineWidth=Math.max(.8,w*(1-i/(P.length-1)*.75));g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f);g.stroke();}g.restore();}
function wavy(g,x1,y1,x2,y2,amp,waves,k=1,w=1.6,col,ph=0){if(k<=0)return;g.save();g.strokeStyle=col||C.pore;g.lineWidth=w;g.lineCap='round';g.beginPath();const N=60,len=Math.hypot(x2-x1,y2-y1),nx=-(y2-y1)/len,ny=(x2-x1)/len;for(let i=0;i<=N*k;i++){const f=i/N,s=Math.sin(f*waves*Math.PI*2+ph)*amp+Math.sin(f*waves*5.3+ph)*amp*.35,x=x1+(x2-x1)*f+nx*s,y=y1+(y2-y1)*f+ny*s;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();g.restore();}
function lens(g,sx,sy,sr,lx,ly,lr,drawFn,k=1){if(k<=0)return;g.save();g.globalAlpha=k;ring(g,sx,sy,sr,C.gold,1);g.strokeStyle=C.gold;g.lineWidth=1.5;g.setLineDash([4,4]);const a=Math.atan2(ly-sy,lx-sx);g.beginPath();g.moveTo(sx+Math.cos(a)*sr,sy+Math.sin(a)*sr);g.lineTo(lx-Math.cos(a)*lr,ly-Math.sin(a)*lr);g.stroke();g.setLineDash([]);g.save();g.beginPath();g.arc(lx,ly,lr,0,Math.PI*2);g.clip();g.fillStyle=C.bg;g.fillRect(lx-lr,ly-lr,2*lr,2*lr);const z=lr/sr;g.translate(lx,ly);g.scale(z,z);g.translate(-sx,-sy);const keep=NOPILL;NOPILL=true;drawFn();NOPILL=keep;g.restore();g.strokeStyle=C.gold;g.lineWidth=2.5;g.beginPath();g.arc(lx,ly,lr,0,Math.PI*2);g.stroke();g.restore();}
function glow(g,x,y,rx,ry,a=1){if(a<=0||rx<=0)return;g.save();g.globalAlpha=a;g.translate(x,y);g.scale(1,ry/rx);const gr=g.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,C.meltHi);gr.addColorStop(.65,C.melt);gr.addColorStop(1,hexA(C.melt,0));g.fillStyle=gr;g.beginPath();g.arc(0,0,rx,0,Math.PI*2);g.fill();g.restore();}
function hDots(g,list,a=1){g.save();g.globalAlpha=a;for(const d of list){g.fillStyle=C.aqua;g.beginPath();g.arc(d[0],d[1],2.8,0,7);g.fill();}g.restore();}

/* =================== PAKET 2–4 =================== */
function blobShape(seed,size,flat=.85){const r=rng(seed),p1=r()*6,p2=r()*6,p3=r()*6,pts=[];for(let i=0;i<40;i++){const a=i/40*Math.PI*2,rad=size*(.8+.15*Math.sin(2*a+p1)+.1*Math.sin(3*a+p2)+.06*Math.sin(5*a+p3));pts.push([Math.cos(a)*rad,Math.sin(a)*rad*flat]);}return pts;}
function drawBlob(g,x,y,pts,k,fill,stroke){if(k<=0)return;g.beginPath();pts.forEach((p,i)=>{const X=x+p[0]*k,Y=y+p[1]*k;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1.2;g.stroke();}}
function sandBlob(g,x,y,pts,k,seed=5){if(k<=0)return;g.save();g.globalAlpha=Math.min(1,k);drawBlob(g,x,y,pts,1,C.sandCT);g.clip();const r=rng(seed);for(let i=0;i<300;i++){g.fillStyle=r()<.55?C.pore:'rgba(255,255,255,.2)';g.fillRect(x-70+r()*140,y-55+r()*110,1.8,1.8);}g.restore();}
function streaks(g,x1,y1,x2,y2,a){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=1.4;for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(x1,y1+i*2);g.lineTo(x2,y2+i*5);g.stroke();}g.restore();}
function holeFill(g,p){g.save();g.fillStyle=C.bg;g.fill(p);g.restore();}

add({id:'ausrichtung',cat:'praxis',title:'Ausrichtung: Best-Fit & RPS',sub:'Wie der Soll-Ist-Vergleich anfängt',total:16500,

  if(rps>0){g.save();g.globalAlpha=rps;g.lineWidth=6;g.strokeStyle=C.up;g.beginPath();g.moveTo(120,115);g.lineTo(120,295);g.stroke();g.strokeStyle=C.down;g.beginPath();g.moveTo(489,115);g.lineTo(489,295);g.stroke();g.restore();pill(g,118,85,'0,0',C.up,rps);pill(g,486,85,'+0,6',C.down,rps);}
  pill(g,300,40,'SOLL (CAD) · IST (CT)',C.text,IN(t,200,2500));

add({id:'schwellwert',cat:'praxis',title:'Porositätsanalyse einstellen',sub:'Schwellwert und Mindestgröße',total:16500,

  SW_N.forEach(p=>{g.fillStyle=hexA(C.pore,.55);g.beginPath();g.arc(p[0],p[1],p[2],0,7);g.fill();});g.restore();
  let th=.5,mode=0;if(t>=2500&&t<6000){th=.18;mode=1;}else if(t>=6000&&t<9500){th=.5;mode=2;}else if(t>=9500&&t<13000){th=.85;mode=3;}else if(t>=13000){th=.5;mode=4;}
  if(mode){const rd=mode===1?24:mode===3?48:40;g.save();g.globalAlpha=.55;g.fillStyle=C.gold;g.beginPath();g.arc(300,135,rd,0,7);g.fill();if(mode===3)SW_N.forEach(p=>{g.beginPath();g.arc(p[0],p[1],p[2]+2,0,7);g.fill();});g.restore();}
  const gy0=250,gy1=370;g.strokeStyle=C.line;g.lineWidth=1.2;g.strokeRect(60,gy0,480,gy1-gy0);
  const val=x=>{const d=Math.abs(x-300);let v=.85;if(d<52)v=.85-.75*clamp((52-d)/22);return v+Math.sin(x*1.3)*.03+Math.sin(x*.41)*.02;};
  g.save();g.strokeStyle=C.aqua;g.lineWidth=2.2;g.beginPath();for(let x=60;x<=540;x+=2){const y=gy1-6-val(x)*(gy1-gy0-12);x===60?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();g.restore();
  if(mode){const y=gy1-6-th*(gy1-gy0-12);g.save();g.strokeStyle=C.gold;g.lineWidth=2;g.setLineDash([8,5]);g.beginPath();g.moveTo(60,y);g.lineTo(540,y);g.stroke();g.restore();}
  pill(g,460,265,'SCHWELLE ZU NIEDRIG',C.down,mode===1?1:0);
  pill(g,460,265,'SCHWELLE RICHTIG',C.up,mode===2?1:0);
  pill(g,460,265,'ZU HOCH: RAUSCHEN = FEHLER',C.down,mode===3?1:0);
  pill(g,460,265,'MINDESTGRÖSSE FILTERT',C.up,mode===4?1:0);
  text(g,66,gy0+12,'GRAUWERT',C.mute,10.5);
  tag(g,'');},
 box:{was:'Die Porositäts- bzw. Defektanalyse trennt Hohlräume vom Material über einen Grauwert-Schwellwert und filtert danach nach Größe.',
  erkennen:['Schwellwert: etwa Mitte zwischen Luft- und Materialgrauwert (oft automatisch bestimmt)','Mindestgröße: in Voxeln oder mm, filtert Rauschen','Gleiche Einstellungen für alle Teile einer Serie verwenden'],

add({id:'aufloesung',cat:'praxis',title:'Auflösung & Brennfleck',sub:'Was kann ich überhaupt sehen?',total:17000,

 steps:[{at:0,text:'Röhre (links), Bauteil (Mitte) und Detektor (rechts). Die Strahlung kommt aus dem BRENNFLECK.'},

  {at:5500,text:'Großer Brennfleck (z. B. 1,0 mm): Die Kante verschmiert – es entsteht ein Halbschatten. Große Brennflecke braucht man oft für hohe Leistung.'},

  {at:12500,text:'Faustregel: Ein Fehler sollte mehrere Voxel groß sein. Links grobe Voxel – die Pore ist kaum zu erkennen. Rechts feine Voxel – klar sichtbar.'}],

   g.strokeStyle=C.text;g.lineWidth=3;g.beginPath();g.moveTo(dx,60);g.lineTo(dx,340);g.stroke();
   const hit=y0=>y0+(150-y0)*(dx-sx)/(ox-sx);const y1=hit(sy-f/2),y2=hit(sy+f/2);

   g.save();g.fillStyle=hexA(C.down,.75);g.fillRect(dx-6,Math.min(y1,y2),12,Math.abs(y2-y1)+1);g.restore();
   pill(g,sx,120,big?'BRENNFLECK 1,0 mm':'BRENNFLECK 0,4 mm',C.gold,F(t,300));
   pill(g,dx-40,y2+30,big?'UNSCHARF':'FAST SCHARF',big?C.down:C.up,F(t,big?5600:2100),'r');
   pill(g,ox+30,345,'BAUTEIL',C.text,F(t,300));pill(g,dx,45,'DETEKTOR',C.text,F(t,300),'r');
   if(t>9500){dim(g,sx,375,dx,375,C.blue,F(t,9500));dim(g,sx,358,ox,358,C.indigo,F(t,9800));text(g,300,385,'M = SDD ÷ SOD',C.blue,12,'center',F(t,9600));}}
  else{[[40,'GROBE VOXEL',28],[320,'FEINE VOXEL',10]].forEach((p,i)=>{const x=p[0],cs=p[2],k=F(t,12500+i*600);g.save();g.globalAlpha=k;g.beginPath();g.rect(x,80,240,240);g.clip();
    for(let yy=80;yy<320;yy+=cs)for(let xx=x;xx<x+240;xx+=cs){const cx=xx+cs/2,cy=yy+cs/2,d=Math.hypot(cx-(x+120),cy-200);const cov=clamp((12-d)/cs+.5);const m=C.name==='dark'?[139,149,161]:[152,162,174];const v=m.map(c=>Math.round(c*(1-cov*.85)));g.fillStyle=`rgb(${v})`;g.fillRect(xx,yy,cs,cs);}g.restore();g.strokeStyle=C.line;g.strokeRect(x,80,240,240);});
   pill(g,160,50,'GROBE VOXEL',C.down,F(t,12500));pill(g,440,50,'FEINE VOXEL',C.up,F(t,13100));pill(g,300,355,'GLEICHE PORE, Ø ≈ 3 VOXEL VS. 8 VOXEL',C.text,F(t,13800));}
  tag(g,t<9500?'SCHEMA · DRAUFSICHT':'');},
 box:{was:'Die Auflösung im CT wird vor allem von der Voxelgröße (Geometrie + Detektor) und der Unschärfe durch den Brennfleck bestimmt.',
  erkennen:['Voxelgröße ≈ Detektorpixel ÷ Vergrößerung','Größerer Brennfleck = mehr Kantenunschärfe, besonders bei hoher Vergrößerung','Mehr Leistung (kV, W) braucht oft einen größeren Brennfleck'],
  bedeutung:'Kleinste sicher erkennbare Fehler liegen meist bei mehreren Voxeln. Darunter kannst du Poren nicht zuverlässig von Rauschen trennen.',

 if(type==='oxidnest'){fillMetal(g,mk([['r',50,60,500,280,24]]));for(let i=0;i<8;i++){const a=r()*Math.PI,len=25+r()*35,x=260+dx+r()*70,y=165+dy+r()*55;wavy(g,x,y,x+Math.cos(a)*len,y+Math.sin(a)*len,3,1.5,1,1.5,C.pore,r()*6);}for(let i=0;i<14;i++){const x=250+dx+r()*110,y=160+dy+r()*80;if(r()<.5)pore(g,x,y,1+r()*2.5);else{g.fillStyle=C.sandCT;g.fillRect(x,y,4,3);}}return;}

 <div class="chips" id="chips">${l.steps.map((s,i)=>`<button class="chip" data-i="${i}">${i+1}</button>`).join('')}</div></div>
 <div class="info"><div class="box b"><h3>Was ist das?</h3><p>${esc(b.was)}</p></div><div class="box g"><h3>So erkennst du es</h3><ul>${b.erkennen.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box y"><h3>Was bedeutet es?</h3><p>${esc(b.bedeutung)}</p></div><div class="box r"><h3>Tipp</h3><p>${esc(b.tipp)}</p></div></div>
 <div class="pn"><button ${prev?`onclick="location.hash='#l-${prev.id}'"`:'disabled'}><small>← ZURÜCK</small>${prev?esc(prev.title):'–'}</button><button ${next?`onclick="location.hash='#l-${next.id}'"`:`onclick="location.hash='#quiz'"`}><small>WEITER →</small>${next?esc(next.title):'Zum Quiz'}</button></div>
 <p class="disc">Vereinfachte Darstellung zum Lernen. Bewertung und Grenzwerte immer nach Zeichnung und Prüfvorgabe.</p>`;
 PL.l=l;PL.t=0;PL.play=true;PL.speed=1;PL.cv=$('#cv');PL.g=PL.cv.getContext('2d');sizeCanvas();
 $('#bplay').onclick=togglePlay;$('#cwrap').onclick=togglePlay;$('#brst').onclick=()=>{PL.t=0;PL.play=true;};
 $('#seek').oninput=e=>{PL.t=+e.target.value;PL.play=false;};
 document.querySelectorAll('.spd .cb').forEach(bt=>bt.onclick=()=>{PL.speed=+bt.dataset.s;document.querySelectorAll('.spd .cb').forEach(x=>x.classList.toggle('on',x===bt));});
 $('#chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;PL.t=l.steps[+c.dataset.i].at+1;PL.play=true;};
 PL.last=performance.now();PL.raf=requestAnimationFrame(loop);}
function togglePlay(){if(!PL.l)return;if(!PL.play&&PL.t>=PL.l.total)PL.t=0;PL.play=!PL.play;}
function sizeCanvas(){if(!PL.cv)return;const w=PL.cv.parentElement.clientWidth||600,dpr=Math.min(2.5,window.devicePixelRatio||1);PL.cv.width=Math.round(w*dpr);PL.cv.height=Math.round(w*H/W*dpr);PL.cssW=w;}
window.addEventListener('resize',()=>{if(PL.l)sizeCanvas();});
function renderLesson(){const l=PL.l,g=PL.g;FS=clamp(Math.pow(560/(PL.cssW||600),.8),1,1.75);const s=PL.cv.width/W;g.setTransform(s,0,0,s,0,0);placed=[];NOPILL=false;l.draw(g,PL.t);}
function loop(now){if(!PL.l)return;const dt=Math.min(100,now-PL.last);PL.last=now;
 if(PL.play){PL.t+=dt*PL.speed;if(PL.t>=PL.l.total){PL.t=PL.l.total;PL.play=false;}}
 renderLesson();const l=PL.l;let si=0;l.steps.forEach((s,i)=>{if(PL.t>=s.at)si=i;});
 if(si===l.steps.length-1)markSeen(l.id);
 const no=`SCHRITT ${si+1} / ${l.steps.length}`;if($('#stepno').textContent!==no){$('#stepno').textContent=no;$('#steptxt').textContent=l.steps[si].text;}
 $('#seek').value=PL.t;$('#bplay').textContent=PL.play?'❚❚':'▶';$('#ov').classList.toggle('show',!PL.play&&PL.t<PL.l.total);
 document.querySelectorAll('#chips .chip').forEach((c,i)=>{c.classList.toggle('on',i===si);c.classList.toggle('done',i<si);});
 PL.raf=requestAnimationFrame(loop);}

/* ---------- Quiz ---------- */
let QZ=null;
const MODES={normal:{n:'Quiz',cnt:10,key:'best',desc:'10 gemischte Fragen: Bilder, Wissen, Rechnen.',acc:'--up',b:5,w:3,r:2},
 pruefung:{n:'Prüfungsmodus',cnt:20,key:'bestP',desc:'20 Fragen aus allen Bereichen – wie eine kleine Prüfung.',acc:'--gold',b:8,w:7,r:5},
 schnell:{n:'Gas oder Lunker?',cnt:10,key:'bestS',desc:'Schnellrunde: 10 Bilder, nur eine Entscheidung.',acc:'--aqua'}};
function showQuizMenu(){QZ=null;let h=`<button class="back" onclick="location.hash=''">← Startseite</button><div class="kicker" style="color:var(--up)">QUIZ · 3 MODI</div><h1>Quiz</h1><p class="lead">Wähle einen Modus. Nach jeder Antwort gibt es eine Erklärung und einen Link zur passenden Lektion.</p><div class="bigtiles">`;
 Object.entries(MODES).forEach(([k,m])=>{h+=`<button class="big" style="--acc:var(${m.acc})" onclick="startQuiz('${k}')"><div class="no">${m.cnt} FRAGEN</div><h2>${esc(m.n)}</h2><p>${esc(m.desc)}</p><div class="ft"><span>BESTWERT ${ST[m.key]||0}/${m.cnt}</span><span class="go" style="margin-left:auto">→</span></div></button>`;});
 V.innerHTML=h+'</div>';window.scrollTo(0,0);}
function bildFrage(tp){const others=shuffle(Object.keys(QTYPES).filter(x=>x!==tp)).slice(0,3);return{kind:'BILDERFRAGE',img:tp,seed:1+Math.floor(Math.random()*9999),q:tp==='artefakt'?'Was ist hier zu sehen?':'Welcher Fehler ist das?',a:QTYPES[tp].name,opts:shuffle([tp,...others].map(x=>QTYPES[x].name)),ex:QTYPES[tp].expl,lesson:QTYPES[tp].lesson};}
function startQuiz(mode='normal'){const m=MODES[mode],qs=[];
 if(mode==='schnell'){for(let i=0;i<10;i++){const tp=pick(['gas','blase','makro','mikro','gas','makro']),gas=tp==='gas'||tp==='blase';qs.push({kind:'SCHNELLRUNDE',img:tp,seed:1+Math.floor(Math.random()*9999),q:'Gas oder Lunker?',a:gas?'Gas (rund, glatt)':'Lunker (zerklüftet)',opts:['Gas (rund, glatt)','Lunker (zerklüftet)'],ex:QTYPES[tp].expl,lesson:'gas-oder-lunker'});}}
 else{shuffle(Object.keys(QTYPES)).slice(0,m.b).forEach(tp=>qs.push(bildFrage(tp)));
  shuffle(WISSEN.slice()).slice(0,m.w).forEach(w=>qs.push({kind:'WISSENSFRAGE',q:w[0],a:w[1],opts:shuffle([w[1],...w[2]]),ex:'Richtige Antwort: '+w[1]+'.',lesson:w[3]}));
  const seen=new Set();let guard=0;while(seen.size<m.r&&guard++<50){const r=rechenFrage();if(seen.has(r.q))continue;seen.add(r.q);qs.push({kind:'RECHENAUFGABE',q:r.q,a:r.a,opts:shuffle([r.a,...r.w.filter((x,j,arr)=>x!==r.a&&arr.indexOf(x)===j)]).slice(0,4),ex:r.ex,lesson:r.lesson});}}
 QZ={mode,qs:mode==='schnell'?qs:shuffle(qs),i:0,score:0,wrong:[],answered:false};if(location.hash!=='#quiz')history.replaceState(null,'','#quiz');showQ();}
function showQ(){const q=QZ.qs[QZ.i],m=MODES[QZ.mode];
 V.innerHTML=`<button class="back" onclick="showQuizMenu()">← Quiz-Auswahl</button><div class="kicker" style="color:var(${m.acc})">${esc(m.n.toUpperCase())} · FRAGE ${QZ.i+1} VON ${QZ.qs.length} · ${QZ.score} RICHTIG</div><h1>${esc(m.n)}</h1>
 <div class="qcard"><div class="qbar"><i style="width:${QZ.i/QZ.qs.length*100}%"></i></div><div class="qtype">${q.kind}</div><p class="qq">${esc(q.q)}</p>${q.img?'<div class="qcv"><canvas id="qcv"></canvas></div>':''}
 <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
 if(q.img)drawQImg();
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));window.scrollTo(0,0);}
function drawQImg(){const q=QZ&&QZ.qs[QZ.i];const c=$('#qcv');if(!q||!c)return;const w=c.parentElement.clientWidth||600,dpr=Math.min(2.5,window.devicePixelRatio||1);c.width=Math.round(w*dpr);c.height=Math.round(w*H/W*dpr);const g=c.getContext('2d');g.setTransform(c.width/W,0,0,c.width/W,0,0);NOPILL=true;quizImage(g,q.img,q.seed);NOPILL=false;}
function answer(b){if(QZ.answered)return;QZ.answered=true;const q=QZ.qs[QZ.i],ok=q.opts[+b.dataset.i]===q.a;
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.i]===q.a)x.classList.add('ok');});if(!ok)b.classList.add('bad');
 if(ok)QZ.score++;else if(!QZ.wrong.includes(q.lesson))QZ.wrong.push(q.lesson);
 const L=LESSONS.find(l=>l.id===q.lesson);
 $('#fb').innerHTML=`<div class="fb"><b style="color:var(${ok?'--up':'--down'})">${ok?'✓ RICHTIG!':'✗ LEIDER FALSCH.'}</b> ${esc(q.ex)}</div><div class="qnav"><button onclick="location.hash='#l-${L.id}'">📖 Lektion: ${esc(L.title)}</button><button class="main" id="qnext">${QZ.i<QZ.qs.length-1?'Nächste Frage →':'Ergebnis anzeigen'}</button></div>`;
 $('#qnext').onclick=()=>{QZ.i++;QZ.answered=false;if(QZ.i<QZ.qs.length)showQ();else showResult();};}
function showResult(){const s=QZ.score,m=MODES[QZ.mode],n=QZ.qs.length,pct=s/n,neu=s>(ST[m.key]||0);if(neu){ST[m.key]=s;save();}
 const msg=pct===1?'Perfekt – du bist bereit für die CT-Prüfung!':pct>=.7?'Sehr gut! Nur noch ein paar Lücken.':pct>=.4?'Guter Anfang – wiederhole die markierten Lektionen.':'Schau dir die Lektionen noch einmal in Ruhe an.';
 V.innerHTML=`<button class="back" onclick="showQuizMenu()">← Quiz-Auswahl</button><div class="kicker" style="color:var(${m.acc})">${esc(m.n.toUpperCase())} · ERGEBNIS</div><h1>Geschafft!</h1>
 <div class="qcard"><div class="score" style="color:var(${pct>=.7?'--up':pct>=.4?'--gold':'--down'})">${s} / ${n}</div><p class="lead" style="margin:0 0 6px">${msg}</p><div class="kicker">BESTWERT: ${ST[m.key]} / ${n}${neu?' · NEUER REKORD!':''}</div>
 ${QZ.wrong.length?`<h3 class="kicker" style="margin-top:18px;color:var(--down)">DAS SOLLTEST DU WIEDERHOLEN</h3><div class="rep">${QZ.wrong.map(id=>{const L=LESSONS.find(l=>l.id===id);return`<button onclick="location.hash='#l-${id}'">📖 ${esc(L.title)} <span style="color:var(--mute)">· ${esc(AREA[L.cat].name)}</span></button>`;}).join('')}</div>`:''}
 <div class="qnav"><button onclick="showQuizMenu()">Quiz-Auswahl</button><button class="main" onclick="startQuiz('${QZ.mode}')">Nochmal ↻</button></div></div>`;window.scrollTo(0,0);}
window.addEventListener('resize',()=>{if(QZ&&location.hash==='#quiz'&&$('#qcv'))drawQImg();});

/* =================== Hell/Dunkel =================== */
let MODE='dark';try{MODE=localStorage.getItem('kompass-theme')||'dark';}catch(e){}
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
function applyTheme(){const t=MODE==='auto'?(mq&&mq.matches?'light':'dark'):MODE;document.documentElement.setAttribute('data-theme',t);setCanvasTheme(t);
 document.querySelector('meta[name="theme-color"]').content=t==='light'?'#f3f5f9':'#05080d';
 document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===MODE?'true':'false'));}
document.querySelectorAll('.theme button').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;try{localStorage.setItem('kompass-theme',MODE);}catch(e){}applyTheme();rerender();});
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(MODE==='auto'){applyTheme();rerender();}});
function rerender(){buildNav();const h=location.hash.slice(1);if(h.startsWith('b-')||h===''||h==='/')route();else if(h==='quiz'&&QZ){if($('#qcv'))drawQImg();}}

applyTheme();updProg();route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
